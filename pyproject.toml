[project]
name = "plumbline"
version = "0.4.0"
description = "Contract-bound, time-limited contractor access for AWS, Azure and GCP, with evidence-backed findings."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "boto3>=1.34", "httpx>=0.27", "pydantic>=2", "reportlab>=4"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
azure = ["azure-identity>=1.17", "azure-mgmt-authorization>=4.0", "azure-mgmt-monitor>=6.0", "msgraph-sdk>=1.5"]
gcp = ["google-auth>=2.30", "google-cloud-iam>=2.15", "google-cloud-logging>=3.10", "google-api-python-client>=2.130"]
dev = ["scikit-learn>=1.3", "pytest>=8", "moto[sts,iam,cloudtrail]>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

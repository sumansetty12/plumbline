[project]
name = "plumbline"
version = "0.3.0"
description = "Contract-bound, time-limited contractor access for AWS, with evidence-backed findings."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "boto3>=1.34", "httpx>=0.27", "pydantic>=2", "reportlab>=4"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["scikit-learn>=1.3", "pytest>=8", "moto[sts,iam,cloudtrail]>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
